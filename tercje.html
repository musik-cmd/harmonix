<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

<script>

/* ================================================
   DANE TERCJI
================================================ */

const intervals = {

    mala: {

        treble: [
            {
                letter: "c",
                octave: 4,
                accidental: ""
            },
            {
                letter: "e",
                octave: 4,
                accidental: "b"
            }
        ],

        bass: [
            {
                letter: "c",
                octave: 3,
                accidental: ""
            },
            {
                letter: "e",
                octave: 3,
                accidental: "b"
            }
        ],

        piano: ["C4", "D#4"]

    },


    wielka: {

        treble: [
            {
                letter: "c",
                octave: 4,
                accidental: ""
            },
            {
                letter: "e",
                octave: 4,
                accidental: ""
            }
        ],

        bass: [
            {
                letter: "c",
                octave: 3,
                accidental: ""
            },
            {
                letter: "e",
                octave: 3,
                accidental: ""
            }
        ],

        piano: ["C4", "E4"]

    },


    zwiekszona: {

        treble: [
            {
                letter: "c",
                octave: 4,
                accidental: ""
            },
            {
                letter: "e",
                octave: 4,
                accidental: "#"
            }
        ],

        bass: [
            {
                letter: "c",
                octave: 3,
                accidental: ""
            },
            {
                letter: "e",
                octave: 3,
                accidental: "#"
            }
        ],

        piano: ["C4", "E#4"]

    },


    zmniejszona: {

        /*
         * C → E𝄫
         *
         * To nadal TERCJA,
         * ponieważ C → D → E
         * obejmuje trzy nazwy dźwięków.
         *
         * E𝄫 brzmi enharmonicznie jak D.
         */

        treble: [
            {
                letter: "c",
                octave: 4,
                accidental: ""
            },
            {
                letter: "e",
                octave: 4,
                accidental: "bb"
            }
        ],

        bass: [
            {
                letter: "c",
                octave: 3,
                accidental: ""
            },
            {
                letter: "e",
                octave: 3,
                accidental: "bb"
            }
        ],

        piano: ["C4", "D4"]

    }

};


/* ================================================
   OTWIERANIE
================================================ */

function toggleInterval(type, button) {

    const item =
        button.parentElement;

    const wasOpen =
        item.classList.contains("open");


    document
        .querySelectorAll(".interval-item")
        .forEach(function(element) {

            element.classList.remove("open");

        });


    if (!wasOpen) {

        item.classList.add("open");

        setTimeout(function() {

            drawInterval(type);

        }, 100);

    }

}


/* ================================================
   POZYCJE LITER
================================================ */

const letterNumber = {

    c: 0,
    d: 1,
    e: 2,
    f: 3,
    g: 4,
    a: 5,
    b: 6

};


/* ================================================
   POZYCJA NUTY
================================================ */

function getStep(note, clef) {

    const absolute =
        note.octave * 7 +
        letterNumber[note.letter];


    let reference;


    if (clef === "treble") {

        reference =
            4 * 7 +
            letterNumber.e;

    } else {

        reference =
            2 * 7 +
            letterNumber.g;

    }


    return absolute - reference;

}


/* ================================================
   RYSOWANIE
================================================ */

function drawInterval(type) {

    const data =
        intervals[type];


    drawStaff(
        type + "-treble",
        "treble",
        data.treble
    );


    drawStaff(
        type + "-bass",
        "bass",
        data.bass
    );

}


/* ================================================
   PIĘCIOLINIA
================================================ */

function drawStaff(
    containerId,
    clef,
    notes
) {

    const container =
        document.getElementById(containerId);


    if (!container) {
        return;
    }


    container.innerHTML = "";


    const width = 700;
    const height = 210;

    const left = 105;
    const right = 650;

    const top = 75;
    const gap = 14;


    let svg = `

        <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 ${width} ${height}"
            width="100%"
            style="
                display:block;
                max-width:700px;
                margin:0 auto;
            "
        >

    `;


    /* PIĘĆ LINII */

    for (let i = 0; i < 5; i++) {

        const y =
            top + i * gap;


        svg += `

            <line
                x1="${left}"
                y1="${y}"
                x2="${right}"
                y2="${y}"
                stroke="#252238"
                stroke-width="1.5"
            />

        `;

    }


    /* KLUCZ */

    if (clef === "treble") {

        svg += `

            <text
                x="25"
                y="140"
                font-family="serif"
                font-size="86"
                fill="#252238"
            >𝄞</text>

        `;

    } else {

        svg += `

            <text
                x="25"
                y="125"
                font-family="serif"
                font-size="64"
                fill="#252238"
            >𝄢</text>

        `;

    }


    /* NUTY */

    const positions = [330, 480];


    notes.forEach(function(note, index) {

        const x =
            positions[index];


        const step =
            getStep(note, clef);


        const y =
            top +
            4 * gap -
            step * (gap / 2);


        /* LINIE DODATKOWE POD */

        if (step <= -2) {

            for (
                let s = -2;
                s >= step;
                s -= 2
            ) {

                const ledgerY =
                    top +
                    4 * gap -
                    s * (gap / 2);


                svg += `

                    <line
                        x1="${x - 20}"
                        y1="${ledgerY}"
                        x2="${x + 20}"
                        y2="${ledgerY}"
                        stroke="#252238"
                        stroke-width="1.5"
                    />

                `;

            }

        }


        /* LINIE DODATKOWE NAD */

        if (step >= 10) {

            for (
                let s = 10;
                s <= step;
                s += 2
            ) {

                const ledgerY =
                    top +
                    4 * gap -
                    s * (gap / 2);


                svg += `

                    <line
                        x1="${x - 20}"
                        y1="${ledgerY}"
                        x2="${x + 20}"
                        y2="${ledgerY}"
                        stroke="#252238"
                        stroke-width="1.5"
                    />

                `;

            }

        }


        /* ZNAK */

        let accidental = "";


        if (note.accidental === "bb") {

            accidental = "𝄫";

        }
        else if (note.accidental === "b") {

            accidental = "♭";

        }
        else if (note.accidental === "#") {

            accidental = "♯";

        }


        if (accidental !== "") {

            svg += `

                <text
                    x="${x - 38}"
                    y="${y + 8}"
                    font-family="serif"
                    font-size="27"
                    fill="#252238"
                >${accidental}</text>

            `;

        }


        /* GŁÓWKA */

        svg += `

            <ellipse
                cx="${x}"
                cy="${y}"
                rx="10"
                ry="7"
                transform="
                    rotate(-18 ${x} ${y})
                "
                fill="#252238"
            />

        `;


        /* LASECZKA */

        svg += `

            <line
                x1="${x + 8}"
                y1="${y}"
                x2="${x + 8}"
                y2="${y - 43}"
                stroke="#252238"
                stroke-width="2"
            />

        `;

    });


    svg += `

        </svg>

    `;


    container.innerHTML =
        svg;

}


/* ================================================
   PIANINO
================================================ */

let piano = null;
let pianoLoaded = false;


async function createPiano() {

    if (pianoLoaded) {
        return;
    }


    try {

        piano =
            new Tone.Sampler({

                urls: {

                    A0: "A0.mp3",
                    C1: "C1.mp3",

                    "D#1": "Ds1.mp3",
                    "F#1": "Fs1.mp3",

                    A1: "A1.mp3",
                    C2: "C2.mp3",

                    "D#2": "Ds2.mp3",
                    "F#2": "Fs2.mp3",

                    A2: "A2.mp3",
                    C3: "C3.mp3",

                    "D#3": "Ds3.mp3",
                    "F#3": "Fs3.mp3",

                    A3: "A3.mp3",
                    C4: "C4.mp3",

                    "D#4": "Ds4.mp3",
                    "F#4": "Fs4.mp3",

                    A4: "A4.mp3",
                    C5: "C5.mp3",

                    "D#5": "Ds5.mp3",
                    "F#5": "Fs5.mp3",

                    A5: "A5.mp3",
                    C6: "C6.mp3",

                    "D#6": "Ds6.mp3",
                    "F#6": "Fs6.mp3",

                    A6: "A6.mp3",
                    C7: "C7.mp3"

                },

                release: 1,

                baseUrl:
                    "https://tonejs.github.io/audio/salamander/"

            }).toDestination();


        await Tone.loaded();


        pianoLoaded = true;

    }

    catch (error) {

        console.error(
            "Błąd pianina:",
            error
        );

    }

}


/* ================================================
   ODTWARZANIE
================================================ */

async function playInterval(type) {

    const data =
        intervals[type];


    const status =
        document.getElementById(
            type + "-status"
        );


    if (status) {

        status.textContent =
            "Ładowanie pianina…";

    }


    await Tone.start();


    await createPiano();


    if (!piano) {

        if (status) {

            status.textContent =
                "Nie udało się załadować dźwięku.";

        }

        return;

    }


    if (status) {

        status.textContent =
            "▶ Odtwarzanie…";

    }


    piano.triggerAttackRelease(
        data.piano[0],
        "1n"
    );


    setTimeout(function() {

        piano.triggerAttackRelease(
            data.piano[1],
            "1n"
        );

    }, 850);


    setTimeout(function() {

        if (status) {

            status.textContent =
                "Gotowe";

        }

    }, 2200);

}

</script>
