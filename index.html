<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonix</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f5ff;
            color: #252238;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 21px;
            color: #6b6680;
            margin-bottom: 45px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 22px;
            padding: 30px 20px;
            box-shadow: 0 8px 30px rgba(40, 30, 80, 0.08);
        }

        .icon {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .card h2 {
            margin: 0 0 10px;
            font-size: 21px;
        }

        .card p {
            margin: 0;
            color: #777187;
            line-height: 1.5;
        }

        @media (max-width: 750px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .logo {
                font-size: 42px;
            }
        }
    </style>
</head>

<body>

    <main class="hero">
        <div class="container">

            <div class="logo">Harmonix</div>

            <div class="subtitle">
                Naucz się słyszeć harmonię.
            </div>

            <div class="cards">

                <div class="card">
                    <div class="icon">🎼</div>
                    <h2>Teoria</h2>
                    <p>Akordy, funkcje, tonacje, kadencje i najważniejsze zasady harmonii.</p>
                </div>

                <div class="card">
                    <div class="icon">🎧</div>
                    <h2>Słuch</h2>
                    <p>Ćwicz rozpoznawanie interwałów, akordów i następstw harmonicznych.</p>
                </div>

                <div class="card">
                    <div class="icon">🎹</div>
                    <h2>Ćwiczenia</h2>
                    <p>Harmonizuj soprany, buduj akordy i rozwiązuj zadania krok po kroku.</p>
                </div>

            </div>

        </div>
    </main>

</body>
</html>
