/* =========================================================
   GAMY NATURALNE
========================================================= */

const SCALES = {

a:
["A","H","C","D","E","F","G","A"],

e:
["E","Fis","G","A","H","C","D","E"],

h:
["H","Cis","D","E","Fis","G","A","H"],

fis:
["Fis","Gis","A","H","Cis","D","E","Fis"],

cis:
["Cis","Dis","E","Fis","Gis","A","H","Cis"],

gis:
["Gis","Ais","H","Cis","Dis","E","Fis","Gis"],

d:
["D","E","F","G","A","B","C","D"],

g:
["G","A","B","C","D","Es","F","G"],

c:
["C","D","Es","F","G","As","B","C"],

f:
["F","G","As","B","C","Des","Es","F"],

b:
["B","C","Des","Es","F","Ges","As","B"],

es:
["Es","F","Ges","As","B","Ces","Des","Es"]

};


/* =========================================================
   ZNAKI PRZYKLUCZOWE
========================================================= */

const KEY_COUNT = {

a:0,

e:1,
h:2,
fis:3,
cis:4,
gis:5,

d:-1,
g:-2,
c:-3,
f:-4,
b:-5,
es:-6

};


const SHARP_ORDER =
["F","C","G","D","A","E","H"];

const FLAT_ORDER =
["H","E","A","D","G","C","F"];


/* =========================================================
   PODWYŻSZANIE NUT
========================================================= */

function raiseNote(note) {

const map = {

C:"Cis",
Cis:"Cisis",
Ces:"C",

D:"Dis",
Dis:"Disis",
Des:"D",

E:"Eis",
Es:"E",
Eis:"Eisis",

F:"Fis",
Fis:"Fisis",
Fes:"F",

G:"Gis",
Gis:"Gisis",
Ges:"G",

A:"Ais",
Ais:"Aisis",
As:"A",

H:"His",

B:"H",
Bes:"B"

};

return map[note] || note;

}


/* =========================================================
   LITERA NUTY
========================================================= */

function getLetter(note) {

if(note.startsWith("C")) return "C";
if(note.startsWith("D")) return "D";
if(note.startsWith("E")) return "E";
if(note.startsWith("F")) return "F";
if(note.startsWith("G")) return "G";
if(note.startsWith("A")) return "A";
if(note.startsWith("H")) return "H";

/* polskie B = obniżone H */

if(note.startsWith("B")) return "H";

return "C";

}


/* =========================================================
   WARTOŚĆ ZNAKU CHROMATYCZNEGO
========================================================= */

function accidentalValue(note) {

if(note === "B") return -1;
if(note === "Bes") return -2;

if(note.endsWith("isis")) return 2;
if(note.endsWith("eses")) return -2;
if(note.endsWith("is")) return 1;
if(note.endsWith("es")) return -1;

return 0;

}


/* =========================================================
   ZNAK WYNIKAJĄCY Z TONACJI
========================================================= */

function keyAccidentalForLetter(root,letter) {

const count = KEY_COUNT[root];

if(count > 0) {

    const used =
        SHARP_ORDER.slice(0,count);

    return used.includes(letter)
        ? 1
        : 0;
}

if(count < 0) {

    const used =
        FLAT_ORDER.slice(
            0,
            Math.abs(count)
        );

    return used.includes(letter)
        ? -1
        : 0;
}

return 0;

}


/* =========================================================
   JAKI ZNAK NAPISAĆ PRZY NUCIE
========================================================= */

function accidentalDifferenceSymbol(
    keyValue,
    wantedValue
) {

if(keyValue === wantedValue)
    return "";

if(wantedValue === 0)
    return "♮";

if(wantedValue === 1)
    return "♯";

if(wantedValue === -1)
    return "♭";

if(wantedValue === 2)
    return "𝄪";

if(wantedValue === -2)
    return "♭♭";

return "";

}


/* =========================================================
   AKTUALNA GAMA
========================================================= */

let currentType = "natural";


function getScale(type=currentType) {

const root =
    document.getElementById("root").value;

const scale =
    [...SCALES[root]];

TYPES[type].raise.forEach(
    degree => {

        scale[degree-1] =
            raiseNote(
                scale[degree-1]
            );

    }
);

return scale;

}


/* =========================================================
   SVG
========================================================= */

const SVG_NS =
    "http://www.w3.org/2000/svg";


function svgElement(
    name,
    attributes={}
) {

const element =
    document.createElementNS(
        SVG_NS,
        name
    );

Object.entries(attributes)
.forEach(
    ([key,value]) => {

        element.setAttribute(
            key,
            value
        );

    }
);

return element;

}


/* =========================================================
   POZYCJE NUT
========================================================= */

const STAFF_Y_BOTTOM = 145;

const LETTER_INDEX = {
    C:0,
    D:1,
    E:2,
    F:3,
    G:4,
    A:5,
    H:6
};


function scalePositions(scale) {

const firstLetter =
    getLetter(scale[0]);

let octave = 4;

if(firstLetter === "H")
    octave = 3;

let previous =
    LETTER_INDEX[firstLetter];

return scale.map(
    (note,index) => {

        const letter =
            getLetter(note);

        const current =
            LETTER_INDEX[letter];

        if(
            index > 0 &&
            current <= previous
        ) {
            octave++;
        }

        const diatonicNumber =
            octave * 7 +
            current;

        const E4 =
            4 * 7 +
            LETTER_INDEX.E;

        const stepsAboveE4 =
            diatonicNumber -
            E4;

        const y =
            STAFF_Y_BOTTOM -
            stepsAboveE4 * 6;

        previous =
            current;

        return {
            note,
            letter,
            octave,
            y
        };

    }
);

}


/* =========================================================
   POZYCJE GAMY W DÓŁ
========================================================= */

function descendingPositions(scale) {

/*
scale podajemy w kolejności od górnej toniki
do dolnej toniki.
*/

const firstLetter =
    getLetter(scale[0]);

let octave = 5;

if(firstLetter === "H")
    octave = 4;

let previous =
    LETTER_INDEX[firstLetter];

return scale.map(
    (note,index) => {

        const letter =
            getLetter(note);

        const current =
            LETTER_INDEX[letter];

        if(
            index > 0 &&
            current >= previous
        ) {
            octave--;
        }

        const diatonicNumber =
            octave * 7 +
            current;

        const E4 =
            4 * 7 +
            LETTER_INDEX.E;

        const stepsAboveE4 =
            diatonicNumber -
            E4;

        const y =
            STAFF_Y_BOTTOM -
            stepsAboveE4 * 6;

        previous = current;

        return {
            note,
            letter,
            octave,
            y
        };

    }
);

}

}


/* =========================================================
   PODWÓJNY BEMOL
========================================================= */

function drawDoubleFlat(svg,x,y) {

drawFlat(svg,x-5,y);
drawFlat(svg,x+6,y);

}


/* =========================================================
   ZNAK PRZY NUCIE
========================================================= */

function drawAccidental(
    svg,
    symbol,
    x,
    y
) {

if(symbol === "♯") {
    drawSharp(svg,x,y);
    return;
}

if(symbol === "♭") {
    drawFlat(svg,x,y);
    return;
}

if(symbol === "♮") {
    drawNatural(svg,x,y);
    return;
}

if(symbol === "𝄪") {
    drawDoubleSharp(svg,x,y);
    return;
}

if(symbol === "♭♭") {
    drawDoubleFlat(svg,x,y);
}

}


/* =========================================================
   ZNAKI PRZYKLUCZOWE
========================================================= */

const SHARP_Y = {
    F:91,
    C:109,
    G:85,
    D:103,
    A:121,
    E:97,
    H:115
};

const FLAT_Y = {
    H:115,
    E:97,
    A:121,
    D:103,
    G:127,
    C:109,
    F:133
};


function drawKeySignature(
    svg,
    root
) {

const count =
    KEY_COUNT[root];

if(count === 0)
    return 90;

let x = 102;

if(count > 0) {

    for(let i=0;i<count;i++) {

        const letter =
            SHARP_ORDER[i];

        drawSharp(
            svg,
            x,
            SHARP_Y[letter]
        );

        x += 17;

    }

} else {

    for(
        let i=0;
        i<Math.abs(count);
        i++
    ) {

        const letter =
            FLAT_ORDER[i];

        drawFlat(
            svg,
            x,
            FLAT_Y[letter]
        );

        x += 17;

    }

}

return x + 15;

}


/* =========================================================
   LINIE DODANE
========================================================= */

function drawLedgerLines(
    svg,
    x,
    y
) {

if(y >= 157) {

    for(
        let ledgerY=157;
        ledgerY<=y+1;
        ledgerY+=12
    ) {

        svg.appendChild(
            svgElement(
                "line",
                {
                    x1:x-14,
                    y1:ledgerY,
                    x2:x+14,
                    y2:ledgerY,
                    stroke:"#373345",
                    "stroke-width":"1.3"
                }
            )
        );

    }

}

if(y <= 85) {

    for(
        let ledgerY=85;
        ledgerY>=y-1;
        ledgerY-=12
    ) {

        svg.appendChild(
            svgElement(
                "line",
                {
                    x1:x-14,
                    y1:ledgerY,
                    x2:x+14,
                    y2:ledgerY,
                    stroke:"#373345",
                    "stroke-width":"1.3"
                }
            )
        );

    }

}

}


/* =========================================================
   RYSOWANIE NUTY
========================================================= */

function drawNote(
    svg,
    x,
    y,
    label,
    accidental,
    clickAction=null
) {

drawLedgerLines(
    svg,
    x,
    y
);

if(accidental) {

    drawAccidental(
        svg,
        accidental,
        x-24,
        y
    );

}


/* GŁÓWKA */

svg.appendChild(

    svgElement(
        "ellipse",
        {
            cx:x,
            cy:y,
            rx:8.5,
            ry:6,
            fill:"#252238",
            transform:
            `rotate(-18 ${x} ${y})`
        }
    )

);


/* LASECZKA */

const stemUp =
    y >= 121;

if(stemUp) {

    svg.appendChild(
        svgElement(
            "line",
            {
                x1:x+7,
                y1:y,
                x2:x+7,
                y2:y-37,
                stroke:"#252238",
                "stroke-width":"1.8"
            }
        )
    );

} else {

    svg.appendChild(
        svgElement(
            "line",
            {
                x1:x-7,
                y1:y,
                x2:x-7,
                y2:y+37,
                stroke:"#252238",
                "stroke-width":"1.8"
            }
        )
    );

}


/* STOPIEŃ */

const degree =
    svgElement(
        "text",
        {
            x:x,
            y:205,
            "text-anchor":"middle",
            "font-family":
            "Arial, sans-serif",
            "font-size":"11",
            "font-weight":"700",
            fill:"#777187"
        }
    );

degree.textContent = label;

svg.appendChild(degree);


/* KLIKNIĘCIE */

if(clickAction) {

    const hit =
        svgElement(
            "rect",
            {
                x:x-27,
                y:y-30,
                width:54,
                height:60,
                fill:"transparent",
                style:"cursor:pointer"
            }
        );

    hit.addEventListener(
        "click",
        clickAction
    );

    svg.appendChild(hit);

}

}


/* =========================================================
   NORMALNA GAMA — 8 NUT
========================================================= */

function drawNormalScaleStaff(
    svgId,
    root,
    scale,
    type,
    clickable=true
) {

const svg =
    document.getElementById(svgId);

svg.innerHTML = "";

drawStaffLines(svg);
drawTrebleClef(svg);

const firstNoteX =
    drawKeySignature(
        svg,
        root
    ) + 35;

const positions =
    scalePositions(scale);

const availableWidth =
    820 - firstNoteX;

const spacing =
    availableWidth / 7;

positions.forEach(
    (item,index) => {

        const x =
            firstNoteX +
            index*spacing;

        let accidental = "";

        if(
            TYPES[type]
            .changed
            .includes(index+1)
        ) {

            const keyValue =
                keyAccidentalForLetter(
                    root,
                    item.letter
                );

            const wantedValue =
                accidentalValue(
                    item.note
                );

            accidental =
                accidentalDifferenceSymbol(
                    keyValue,
                    wantedValue
                );

        }

        drawNote(
            svg,
            x,
            item.y,
            [
                "I","II","III","IV",
                "V","VI","VII","VIII"
            ][index],
            accidental,
            clickable
                ? () => playSingleNote(index)
                : null
        );

    }
);

}


/* =========================================================
   MELODYCZNA — GÓRA + DÓŁ NA JEDNEJ PIĘCIOLINII
========================================================= */

function drawMelodicStaff(
    svgId,
    root,
    clickable=true
) {

const svg =
    document.getElementById(svgId);

svg.innerHTML = "";

drawStaffLines(svg);
drawTrebleClef(svg);

const natural =
    [...SCALES[root]];


/* =========================
   W GÓRĘ
========================= */

const up =
    [...natural];

up[5] =
    raiseNote(up[5]);

up[6] =
    raiseNote(up[6]);


/* =========================
   W DÓŁ — NATURALNA
========================= */

const down =
    [...natural]
    .reverse();


const upPositions =
    scalePositions(up);

const downPositions =
    descendingPositions(down);


const firstNoteX =
    drawKeySignature(
        svg,
        root
    ) + 28;


/*
15 nut:
8 w górę +
7 w dół, bez powtarzania górnej toniki.
*/

const totalNotes = 15;

const availableWidth =
    825-firstNoteX;

const spacing =
    availableWidth /
    (totalNotes-1);


/* =========================
   STRZAŁKA / OPIS
========================= */

const upLabel =
    svgElement(
        "text",
        {
            x:firstNoteX+110,
            y:55,
            "text-anchor":"middle",
            "font-family":"Arial",
            "font-size":"10",
            "font-weight":"700",
            fill:"#9993a6"
        }
    );

upLabel.textContent =
    "W GÓRĘ ↑";

svg.appendChild(upLabel);


const downLabel =
    svgElement(
        "text",
        {
            x:firstNoteX+550,
            y:55,
            "text-anchor":"middle",
            "font-family":"Arial",
            "font-size":"10",
            "font-weight":"700",
            fill:"#9993a6"
        }
    );

downLabel.textContent =
    "W DÓŁ ↓";

svg.appendChild(downLabel);


/* =========================
   NUTY W GÓRĘ
========================= */

upPositions.forEach(
    (item,index) => {

        const x =
            firstNoteX +
            index*spacing;

        let accidental = "";

        if(
            index === 5 ||
            index === 6
        ) {

            const keyValue =
                keyAccidentalForLetter(
                    root,
                    item.letter
                );

            const wantedValue =
                accidentalValue(
                    item.note
                );

            accidental =
                accidentalDifferenceSymbol(
                    keyValue,
                    wantedValue
                );

        }

        drawNote(
            svg,
            x,
            item.y,
            [
                "I","II","III","IV",
                "V","VI↑","VII↑","VIII"
            ][index],
            accidental,
            clickable
                ? () => playMelodicVisualNote(
                    index,
                    true
                )
                : null
        );

    }
);


/* =========================
   NUTY W DÓŁ
========================= */

/*
Pomijamy down[0], bo jest to ta sama
górna tonika, którą już zapisaliśmy.
*/

downPositions
.slice(1)
.forEach(
    (item,index) => {

        const actualIndex =
            index+1;

        const x =
            firstNoteX +
            (8+index)*spacing;


        /*
        Przy zejściu VI i VII wracają
        do postaci naturalnej.

        Jeżeli tonacja przy kluczu ma już
        odpowiedni znak, nie trzeba nic
        dopisywać.

        Jednak po wcześniejszym znaku
        podwyższającym w takcie trzeba
        pokazać anulowanie znaku.

        Dlatego przy odpowiadających
        stopniach zapisujemy znak
        naturalnej postaci.
        */

        let accidental = "";


        /*
        down:
        VIII VII VI V IV III II I

        actualIndex 1 = VII
        actualIndex 2 = VI
        */

        if(
            actualIndex === 1 ||
            actualIndex === 2
        ) {

            const wantedValue =
                accidentalValue(
                    item.note
                );

            /*
            Ponieważ wcześniej w tym samym
            zapisie VII/VI zostały podwyższone,
            pokazujemy powrót do wartości
            wynikającej z gamy naturalnej.
            */

            if(wantedValue === 0)
                accidental = "♮";

            else if(wantedValue === -1)
                accidental = "♭";

            else if(wantedValue === 1)
                accidental = "♯";

        }


        const labels =
        [
            "VIII",
            "VII",
            "VI",
            "V",
            "IV",
            "III",
            "II",
            "I"
        ];


        drawNote(
            svg,
            x,
            item.y,
            labels[actualIndex],
            accidental,
            clickable
                ? () =>
                playMelodicVisualNote(
                    actualIndex,
                    false
                )
                : null
        );

    }
);

}

let piano = null;
let pianoLoading = false;


async function getPiano() {

const status =
    document.getElementById(
        "audioStatus"
    );

try {

    await Tone.start();

    if(piano)
        return piano;


    if(pianoLoading) {

        status.textContent =
            "Ładowanie fortepianu…";

        while(pianoLoading) {

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        100
                    )
            );

        }

        return piano;

    }


    pianoLoading = true;

    status.textContent =
        "Ładowanie fortepianu…";


    piano =
        new Tone.Sampler({

            urls: {

                A0:"A0.mp3",

                C1:"C1.mp3",
                "D#1":"Ds1.mp3",
                "F#1":"Fs1.mp3",

                A1:"A1.mp3",

                C2:"C2.mp3",
                "D#2":"Ds2.mp3",
                "F#2":"Fs2.mp3",

                A2:"A2.mp3",

                C3:"C3.mp3",
                "D#3":"Ds3.mp3",
                "F#3":"Fs3.mp3",

                A3:"A3.mp3",

                C4:"C4.mp3",
                "D#4":"Ds4.mp3",
                "F#4":"Fs4.mp3",

                A4:"A4.mp3",

                C5:"C5.mp3",
                "D#5":"Ds5.mp3",
                "F#5":"Fs5.mp3",

                A5:"A5.mp3",

                C6:"C6.mp3"

            },

            baseUrl:
            "https://tonejs.github.io/audio/salamander/",

            release:1.4

        })
        .toDestination();


    await Tone.loaded();

    pianoLoading = false;

    status.textContent =
        "Fortepian gotowy ✓";

    return piano;

}

catch(error) {

    pianoLoading = false;
    piano = null;

    status.textContent =
        "Nie udało się załadować fortepianu.";

    console.error(error);

    return null;

}

}


/* =========================================================
   MIDI
========================================================= */

const ROOT_MIDI = {

a:69,
e:64,
h:71,
fis:66,
cis:61,
gis:68,

d:62,
g:67,
c:60,
f:65,
b:70,
es:63

};


const PITCHES = [
    "C",
    "C#",
    "D",
    "D#",
    "E",
    "F",
    "F#",
    "G",
    "G#",
    "A",
    "A#",
    "B"
];


function midiName(midi) {

return (
    PITCHES[midi % 12] +
    (
        Math.floor(midi/12)-1
    )
);

}


function midiScale(
    type=currentType
) {

const root =
    document.getElementById(
        "root"
    ).value;

const base =
    ROOT_MIDI[root];

return TYPES[type]
    .offsets
    .map(
        offset =>
            base + offset
    );

}


/* =========================================================
   POJEDYNCZA NUTA
========================================================= */

async function playSingleNote(index) {

const instrument =
    await getPiano();

if(!instrument)
    return;

const notes =
    midiScale();

instrument.triggerAttackRelease(
    midiName(
        notes[index]
    ),
    .9
);

}


/* =========================================================
   NUTA MELODYCZNEJ
========================================================= */

async function playMelodicVisualNote(
    index,
    goingUp
) {

const instrument =
    await getPiano();

if(!instrument)
    return;

const root =
    document.getElementById(
        "root"
    ).value;

const base =
    ROOT_MIDI[root];


let notes;

if(goingUp) {

    notes =
        TYPES.melodic
        .offsets
        .map(
            offset =>
                base+offset
        );

} else {

    notes =
        TYPES.natural
        .offsets
        .map(
            offset =>
                base+offset
        )
        .reverse();

}

instrument.triggerAttackRelease(
    midiName(
        notes[index]
    ),
    .9
);

}


/* =========================================================
   ODSŁUCH GAMY
========================================================= */

async function playScale(direction) {

const instrument =
    await getPiano();

if(!instrument)
    return;


const root =
    document.getElementById(
        "root"
    ).value;

const base =
    ROOT_MIDI[root];


let notes;


/* MELODYCZNA */

if(currentType === "melodic") {

    const up =
        TYPES.melodic
        .offsets
        .map(
            offset =>
                base+offset
        );

    const down =
        TYPES.natural
        .offsets
        .map(
            offset =>
                base+offset
        )
        .reverse();


    if(direction === "up") {

        notes = up;

    }

    else if(direction === "down") {

        notes = down;

    }

    else {

        notes = [
            ...up,
            ...down.slice(1)
        ];

    }

}


/* POZOSTAŁE */

else {

    const up =
        TYPES[currentType]
        .offsets
        .map(
            offset =>
                base+offset
        );

    if(direction === "up") {

        notes = up;

    }

    else if(direction === "down") {

        notes =
            [...up]
            .reverse();

    }

    else {

        notes = [
            ...up,
            ...up
            .slice(0,-1)
            .reverse()
        ];

    }

}


const start =
    Tone.now()+.1;


notes.forEach(
    (midi,index) => {

        instrument.triggerAttackRelease(
            midiName(midi),
            .85,
            start + index*.43,
            .75
        );

    }
);

}

        );

        );

        ) {

            );

                ];

            };

);

/* =========================================================
   SPRAWDZENIE BUDOWANIA
========================================================= */

function checkBuilder() {

const expected =
    TYPES[builderType]
    .changed;

const selected =
    Object.keys(
        builderChanges
    )
    .filter(
        key =>
            builderChanges[key]
    )
    .map(Number);


const correct =
    expected.length ===
    selected.length
    &&
    expected.every(
        degree =>
            selected.includes(
                degree
            )
    );


const feedback =
    document.getElementById(
        "builderFeedback"
    );


if(correct) {

    feedback.textContent =
        "✓ Dobrze!";

    setTimeout(
        newBuilder,
        900
    );

} else {

    let answer =
        "bez zmian";

    if(expected.length) {

        answer =
            expected
            .map(
                degree =>
                    "↑ " +
                    [
                        "I","II","III","IV",
                        "V","VI","VII","VIII"
                    ][degree-1]
            )
            .join(", ");

    }

    feedback.textContent =
        "Jeszcze nie — poprawnie: " +
        answer;

}

}

            .75
        );

    }
);
