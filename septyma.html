<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Septymy — Harmonix</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f5ff;color:#252238}
.page{max-width:950px;margin:0 auto;padding:50px 20px 80px}
.back{display:inline-block;margin-bottom:30px;color:#6b6680;text-decoration:none;font-size:15px}
h1{text-align:center;font-size:42px;margin:0 0 10px}
.subtitle{text-align:center;color:#6b6680;font-size:18px;margin-bottom:40px}
.interval-list{display:flex;flex-direction:column;gap:14px}
.interval-item{background:white;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px rgba(40,30,80,.08)}
.interval-button{width:100%;border:0;background:white;padding:22px 25px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:#252238;font-size:18px;font-weight:700}
.interval-content{display:none;padding:0 25px 30px}
.interval-item.open .interval-content{display:block}
.arrow{font-size:20px}
.interval-item.open .arrow{transform:rotate(180deg)}
.staff-title{font-size:15px;color:#6b6680;margin:20px 0 5px;font-weight:600}
.staff-box{width:100%;overflow:hidden}
.listen-area{text-align:center;margin-top:25px}
.listen-button{border:0;border-radius:12px;padding:13px 24px;background:#252238;color:white;font-size:15px;font-weight:600;cursor:pointer}
.listen-button:disabled{opacity:.6}
.status{margin-top:10px;font-size:13px;color:#777187;min-height:18px}
</style>
</head>

<body>

<div class="page">

<a href="interwaly.html" class="back">← Wróć do interwałów</a>

<h1>Septymy</h1>
<div class="subtitle">Zmniejszone, małe, wielkie i zwiększone</div>

<div class="interval-list" id="list"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

<script>

const intervals={

zmniejszona:{
name:"Septyma zmniejszona",
treble:[
{letter:"c",octave:4,accidental:""},
{letter:"b",octave:4,accidental:"bb"}
],
bass:[
{letter:"c",octave:3,accidental:""},
{letter:"b",octave:3,accidental:"bb"}
],
piano:["C4","A4"]
},

mala:{
name:"Septyma mała",
treble:[
{letter:"c",octave:4,accidental:""},
{letter:"b",octave:4,accidental:"b"}
],
bass:[
{letter:"c",octave:3,accidental:""},
{letter:"b",octave:3,accidental:"b"}
],
piano:["C4","A#4"]
},

wielka:{
name:"Septyma wielka",
treble:[
{letter:"c",octave:4,accidental:""},
{letter:"b",octave:4,accidental:""}
],
bass:[
{letter:"c",octave:3,accidental:""},
{letter:"b",octave:3,accidental:""}
],
piano:["C4","B4"]
},

zwiekszona:{
name:"Septyma zwiększona",
treble:[
{letter:"c",octave:4,accidental:""},
{letter:"b",octave:4,accidental:"#"}
],
bass:[
{letter:"c",octave:3,accidental:""},
{letter:"b",octave:3,accidental:"#"}
],
piano:["C4","C5"]
}

};


/* KARTY */

const list=document.getElementById("list");

Object.entries(intervals).forEach(([type,data])=>{

list.innerHTML+=`

<div class="interval-item">

<button class="interval-button"
onclick="toggleInterval('${type}',this)">

<span>♩ ${data.name}</span>
<span class="arrow">⌄</span>

</button>

<div class="interval-content">

<div class="staff-title">Klucz wiolinowy</div>
<div id="${type}-treble" class="staff-box"></div>

<div class="staff-title">Klucz basowy</div>
<div id="${type}-bass" class="staff-box"></div>

<div class="listen-area">

<button class="listen-button"
onclick="playInterval('${type}',this)">
▶ Posłuchaj
</button>

<div id="${type}-status" class="status"></div>

</div>
</div>
</div>

`;

});


function toggleInterval(type,button){

const item=button.parentElement;
const open=item.classList.contains("open");

document.querySelectorAll(".interval-item")
.forEach(x=>x.classList.remove("open"));

if(!open){

item.classList.add("open");

setTimeout(()=>{
drawInterval(type);
},50);

}

}


/* PIĘCIOLINIA */

const letterNumber={
c:0,d:1,e:2,f:3,g:4,a:5,b:6
};

function getStep(note,clef){

const absolute=
note.octave*7+
letterNumber[note.letter];

const reference=
clef==="treble"
?4*7+letterNumber.e
:2*7+letterNumber.g;

return absolute-reference;

}


function drawInterval(type){

drawStaff(
type+"-treble",
"treble",
intervals[type].treble
);

drawStaff(
type+"-bass",
"bass",
intervals[type].bass
);

}


function drawStaff(id,clef,notes){

const container=document.getElementById(id);

const width=700;
const height=210;

const left=105;
const right=650;

const top=75;
const gap=14;

let svg=`
<svg
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 ${width} ${height}"
width="100%"
style="display:block;max-width:700px;margin:auto">
`;


/* 5 LINII */

for(let i=0;i<5;i++){

const y=top+i*gap;

svg+=`
<line
x1="${left}"
y1="${y}"
x2="${right}"
y2="${y}"
stroke="#252238"
stroke-width="1.5"/>
`;

}


/* KLUCZE */

if(clef==="treble"){

svg+=`
<text
x="25"
y="140"
font-family="serif"
font-size="86"
fill="#252238">𝄞</text>
`;

}else{

svg+=`
<text
x="25"
y="125"
font-family="serif"
font-size="64"
fill="#252238">𝄢</text>
`;

}


const positions=[330,480];

notes.forEach((note,index)=>{

const x=positions[index];

const step=getStep(note,clef);

const y=
top+
4*gap-
step*(gap/2);


/* LINIE DODANE POD */

if(step<=-2){

for(let s=-2;s>=step;s-=2){

const ly=
top+4*gap-s*(gap/2);

svg+=`
<line
x1="${x-20}"
y1="${ly}"
x2="${x+20}"
y2="${ly}"
stroke="#252238"
stroke-width="1.5"/>
`;

}

}


/* LINIE DODANE NAD */

if(step>=10){

for(let s=10;s<=step;s+=2){

const ly=
top+4*gap-s*(gap/2);

svg+=`
<line
x1="${x-20}"
y1="${ly}"
x2="${x+20}"
y2="${ly}"
stroke="#252238"
stroke-width="1.5"/>
`;

}

}


/* ZNAKI */

let accidental="";

if(note.accidental==="b") accidental="♭";
if(note.accidental==="#") accidental="♯";
if(note.accidental==="bb") accidental="𝄫";

if(accidental){

svg+=`
<text
x="${x-38}"
y="${y+8}"
font-family="serif"
font-size="27"
fill="#252238">${accidental}</text>
`;

}


/* NUTA */

svg+=`
<ellipse
cx="${x}"
cy="${y}"
rx="10"
ry="7"
transform="rotate(-18 ${x} ${y})"
fill="#252238"/>

<line
x1="${x+8}"
y1="${y}"
x2="${x+8}"
y2="${y-43}"
stroke="#252238"
stroke-width="2"/>
`;

});

svg+="</svg>";

container.innerHTML=svg;

}


/* ==========================================
   PIANINO — DWA NIEZALEŻNE GŁOSY
========================================== */

const pianoUrls={

A0:"A0.mp3",
C1:"C1.mp3",
"D#1":"Ds1.mp3",
"F#1":"Fs1.mp3",

A1:"A1.mp3",
C2:"C2.mp3",
"D#2":"Ds2.mp3",
"F#2":"Fs2.mp3",

A2:"A2.mp3",
C3:"C3.mp3",
"D#3":"Ds3.mp3",
"F#3":"Fs3.mp3",

A3:"A3.mp3",
C4:"C4.mp3",
"D#4":"Ds4.mp3",
"F#4":"Fs4.mp3",

A4:"A4.mp3",
C5:"C5.mp3",
"D#5":"Ds5.mp3",
"F#5":"Fs5.mp3",

A5:"A5.mp3",
C6:"C6.mp3",
"D#6":"Ds6.mp3",
"F#6":"Fs6.mp3",

A6:"A6.mp3",
C7:"C7.mp3"

};

let piano1=null;
let piano2=null;


async function createPianos(){

if(piano1 && piano2){
return;
}

piano1=new Tone.Sampler({

urls:pianoUrls,
release:1.4,

baseUrl:
"https://tonejs.github.io/audio/salamander/"

}).toDestination();


piano2=new Tone.Sampler({

urls:pianoUrls,
release:1.4,

baseUrl:
"https://tonejs.github.io/audio/salamander/"

}).toDestination();


await Tone.loaded();

}


function wait(ms){

return new Promise(
resolve=>setTimeout(resolve,ms)
);

}


/* ODTWARZANIE */

async function playInterval(type,button){

button.disabled=true;

const status=
document.getElementById(
type+"-status"
);

try{

status.textContent=
"Ładowanie pianina…";

await Tone.start();

await createPianos();

const first=
intervals[type].piano[0];

const second=
intervals[type].piano[1];


/* MELODYCZNIE */

status.textContent=
"🎵 Melodycznie";

piano1.triggerAttackRelease(
first,
0.7
);

await wait(850);

piano1.triggerAttackRelease(
second,
0.7
);

await wait(1200);


/* HARMONICZNIE */

status.textContent=
"🎶 Harmonicznie";

const together=
Tone.now()+0.15;

piano1.triggerAttackRelease(
first,
1.8,
together
);

piano2.triggerAttackRelease(
second,
1.8,
together
);

await wait(2100);

status.textContent=
"✓ Melodycznie + harmonicznie";

await wait(500);

status.textContent="";

}catch(error){

console.error(
"Harmonix:",
error
);

status.textContent=
"Nie udało się odtworzyć dźwięku.";

}

button.disabled=false;

}

</script>

</body>
</html>
